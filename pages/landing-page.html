<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Landing Page</title>
    <link rel="stylesheet" href="../styles.css" />

  <body class="bg-slate-200">
    <header class="p-2 pt-10 flex justify-between items-center absolute z-10 " >
      <div class=" pl-5 pr-60">
        <img class="h-8" src="./images/logo.svg" alt="logo" />
      </div>
      <div class=" w-1/5 relative">
        <nav class="hidden sm:flex">
          <a href="#">ABOUT</a>
          <a href="#">CAREERS</a>

          <a href="#">SUPPORT</a>
        </nav>
        <img src="./images/icon-hamburger.svg" alt="hamburger" />
      </div>
    </header>
    <main>
      <div class="relative" id="hero">
        <h1 class=" left-1/20 top-1/2 w-9/10 z-11 text-5xl text-white border border-white absolute">IMMERSIVE EXPERIENCES THAT DELIVER</h1>
        <img class=" w-screen relative" src="./images/mobile/image-hero.jpg" alt="" />
        
      </div>
      <section class="flex flex-col justify-center items-center text-center">
        <img class="w-9/10" src="./images/mobile/image-interactive.jpg" alt="interactive" />

          <h2></h2>
          <p></p>

      </section>
      <article>
        <h2></h2>
        <div id="img-container">
          <img src="./images/mobile/image-deep-earth.jpg" alt="" />
          <img src="./images/mobile/image-night-arcade.jpg" alt="" />
          <img src="./images/mobile/image-soccer-team.jpg" alt="" />
          <img src="./images/mobile/image-grid.jpg" alt="" />
          <img src="./images/mobile/image-from-above.jpg" alt="" />
          <img src="./images/mobile/image-pocket-borealis.jpg" alt="" />
          <img src="./images/mobile/image-curiosity.jpg" alt="" />
          <img src="./images/mobile/image-fisheye.jpg" alt="" />
        </div>
        <button type="button">SEE ALL</button>
      </article>
    </main>
    <footer>
      <img src="./images/logo.svg" alt="" />
      <div>
        <a href="#">ABOUT</a>
        <a href="#">CAREERS</a>
        <a href="#">EVENTS</a>
        <a href="#">PRODUCTS</a>
        <a href="#">SUPPORT</a>

    </footer>
